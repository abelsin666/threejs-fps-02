<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Neon Tactix — Three.js Tactical FPS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
    #crosshair {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 20px; height: 20px; z-index: 100; pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: #0f0;
    }
    #crosshair::before { width: 2px; height: 20px; left: 9px; top: 0; }
    #crosshair::after { width: 20px; height: 2px; left: 0; top: 9px; }
    #hud {
      position: fixed; bottom: 20px; left: 20px; color: #0f0;
      font-size: 14px; z-index: 100; text-shadow: 0 0 10px #0f0;
    }
    #kills {
      position: fixed; top: 20px; right: 20px; color: #f00;
      font-size: 24px; z-index: 100; text-shadow: 0 0 10px #f00;
    }
    #msg {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      color: #0f0; font-size: 48px; z-index: 200; text-shadow: 0 0 20px #0f0;
      display: none;
    }
  </style>
</head>
<body>
  <div id="crosshair"></div>
  <div id="hud">WASD: Move | Click: Shoot | R: Reload | Shift: Sprint</div>
  <div id="kills">KILLS: 0</div>
  <div id="msg"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Game state
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0a);
    scene.fog = new THREE.FogExp2(0x0a0a0a, 0.02);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.7, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // Lighting
    scene.add(new THREE.AmbientLight(0x111111));
    const dirLight = new THREE.DirectionalLight(0x4488ff, 0.3);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    // Ground grid
    const gridHelper = new THREE.GridHelper(100, 50, 0x004444, 0x002222);
    gridHelper.position.y = 0;
    scene.add(gridHelper);

    // Neon pillars
    const pillarGeo = new THREE.BoxGeometry(2, 8, 2);
    const pillarMat = new THREE.MeshStandardMaterial({ color: 0x001122, emissive: 0x001122 });
    for (let i = 0; i < 20; i++) {
      const p = new THREE.Mesh(pillarGeo, pillarMat);
      p.position.set(
        (Math.random() - 0.5) * 80,
        4,
        (Math.random() - 0.5) * 80
      );
      scene.add(p);
      const light = new THREE.PointLight(0x00ffff, 2, 15);
      light.position.copy(p.position);
      scene.add(light);
    }

    // Enemies
    const enemies = [];
    const enemyGeo = new THREE.SphereGeometry(0.5, 16, 16);
    const enemyMat = new THREE.MeshStandardMaterial({ color: 0xff0044, emissive: 0xff0044 });
    for (let i = 0; i < 10; i++) {
      const e = new THREE.Mesh(enemyGeo, enemyMat.clone());
      e.position.set(
        (Math.random() - 0.5) * 60,
        0.5,
        (Math.random() - 0.5) * 60
      );
      scene.add(e);
      enemies.push(e);
    }

    // Bullets
    const bullets = [];
    const bulletGeo = new THREE.SphereGeometry(0.05, 8, 8);
    const bulletMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });

    // Controls
    const keys = {};
    document.addEventListener('keydown', e => keys[e.code] = true);
    document.addEventListener('keyup', e => keys[e.code] = false);

    let yaw = 0, pitch = 0, locked = false;
    document.addEventListener('click', () => {
      if (!locked) {
        renderer.domElement.requestPointerLock();
      }
    });
    document.addEventListener('pointerlockchange', () => {
      locked = document.pointerLockElement === renderer.domElement;
      if (!locked) document.getElementById('crosshair').style.display = 'none';
      else document.getElementById('crosshair').style.display = 'block';
    });
    document.addEventListener('mousemove', e => {
      if (!locked) return;
      yaw -= e.movementX * 0.002;
      pitch -= e.movementY * 0.002;
      pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
    });

    let kills = 0;
    let ammo = 30;

    function shoot() {
      if (ammo <= 0) return;
      ammo--;
      const bullet = new THREE.Mesh(bulletGeo, bulletMat.clone());
      bullet.position.copy(camera.position);
      const dir = new THREE.Vector3(0, 0, -1);
      dir.applyQuaternion(camera.quaternion);
      bullet.userData.velocity = dir.multiplyScalar(50);
      scene.add(bullet);
      bullets.push(bullet);
    }

    document.addEventListener('mousedown', () => { if (locked) shoot(); });

    function respawnEnemy(e) {
      e.position.set((Math.random()-0.5)*60, 0.5, (Math.random()-0.5)*60);
      e.visible = true;
    }

    function animate() {
      requestAnimationFrame(animate);

      // Movement
      const speed = keys.ShiftLeft ? 12 : 5;
      const forward = new THREE.Vector3(0,0,-1).applyQuaternion(new THREE.Quaternion().setFromEuler(new THREE.Euler(0,yaw,0)));
      const right = new THREE.Vector3(1,0,0).applyQuaternion(new THREE.Quaternion().setFromEuler(new THREE.Euler(0,yaw,0)));
      if (keys.KeyW) camera.position.addScaledVector(forward, speed * 0.016);
      if (keys.KeyS) camera.position.addScaledVector(forward, -speed * 0.016);
      if (keys.KeyA) camera.position.addScaledVector(right, -speed * 0.016);
      if (keys.KeyD) camera.position.addScaledVector(right, speed * 0.016);
      camera.position.y = 1.7;

      camera.rotation.set(0, 0, 0);
      camera.rotateY(yaw);
      camera.rotateX(pitch);

      // Enemy AI: move toward player
      enemies.forEach(e => {
        if (e.visible) {
          const dir = new THREE.Vector3().subVectors(camera.position, e.position).normalize();
          e.position.addScaledVector(dir, 2 * 0.016);
        }
      });

      // Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.position.add(b.userData.velocity.clone().multiplyScalar(0.016));
        // Collision
        let hit = false;
        enemies.forEach(e => {
          if (e.visible && b.position.distanceTo(e.position) < 0.8) {
            e.visible = false;
            kills++;
            document.getElementById('kills').textContent = `KILLS: ${kills}`;
            setTimeout(() => respawnEnemy(e), 3000);
            hit = true;
          }
        });
        if (hit || b.position.length() > 200) {
          scene.remove(b);
          bullets.splice(i, 1);
        }
      }

      // Reload
      if (keys.KeyR && ammo < 30) {
        ammo = 30;
      }

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
